
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | Deadline Radar</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: radial-gradient(circle at top left, #12345a 0, #081321 38%, #050e19 100%);
            color: #fff;
            min-height: 100vh;
        }

        .navbar {
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            padding: 14px 28px;
            background: rgba(5,15,28,.92);
            border-bottom: 1px solid rgba(255,255,255,.08);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .brand { font-size: 21px; font-weight: 700; }
        .brand span { color: #27b9f2; }

        .nav-links { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .nav-links a {
            color: #b8c5d5;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 9px;
            font-size: 14px;
        }

        .nav-links a:hover, .nav-links a.active {
            background: #0d3049;
            color: #29baf4;
        }

        .container { width: min(1220px, 92%); margin: auto; padding: 32px 0 50px; }
        .page-header { margin-bottom: 28px; }
        .page-header h1 { font-size: 30px; margin-bottom: 7px; }
        .page-header p, .muted { color: #8497ad; font-size: 14px; }

        .header-actions, .bottom-links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

        .btn {
            display: inline-block;
            border: 1px solid #263e55;
            background: #0e2034;
            color: #dce8f3;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            font-size: 13px;
        }

        .btn:hover { background: #15334d; border-color: #2a668c; }
        .btn-primary { background: #0b78aa; border-color: #0b78aa; color: #fff; }
        .btn-primary:hover { background: #0990ca; }

        .stats-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 16px; margin-bottom: 24px; }

        .stat-card {
            background: rgba(15,35,57,.88);
            border: 1px solid rgba(113,155,190,.16);
            border-radius: 15px;
            padding: 21px;
            min-height: 125px;
        }

        .stat-label { font-size: 12px; color: #8fb3d3; text-transform: uppercase; letter-spacing: .5px; }
        .stat-value { font-size: 30px; font-weight: 700; margin-top: 9px; }
        .stat-info { font-size: 12px; color: #7590aa; margin-top: 5px; }

        .two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

        .card {
            background: rgba(14,33,54,.92);
            border: 1px solid rgba(113,155,190,.17);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,.12);
            min-width: 0;
        }

        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .card-subtitle { color: #8198af; font-size: 13px; margin-bottom: 24px; }

        .completion-area { min-height: 290px; display: flex; align-items: center; justify-content: center; }

        .progress-circle {
            width: 190px;
            height: 190px;
            max-width: 100%;
            border-radius: 50%;
            background: conic-gradient(#29b8ef 0deg, #29b8ef var(--progress), #183a59 var(--progress), #183a59 360deg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .progress-circle::before {
            content: "";
            position: absolute;
            width: 145px;
            height: 145px;
            background: #0e2136;
            border-radius: 50%;
        }

        .progress-content { position: relative; z-index: 1; text-align: center; }
        .progress-number { font-size: 31px; font-weight: 700; }
        .progress-label { color: #8fa5bb; font-size: 12px; margin-top: 3px; }

        .bar-row { margin-bottom: 18px; }
        .bar-header { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 7px; font-size: 13px; }
        .bar-name { color: #dbe7f1; overflow-wrap: anywhere; }
        .bar-count { color: #9eb5c9; }
        .bar-track { width: 100%; height: 9px; border-radius: 10px; background: #162e47; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg,#1d9fda,#35c4f4); transition: width .5s ease; }

        .priority-high .bar-fill { background: linear-gradient(90deg,#d94a57,#f06a74); }
        .priority-medium .bar-fill { background: linear-gradient(90deg,#c28a35,#e7b957); }
        .priority-low .bar-fill { background: linear-gradient(90deg,#238e71,#35bd98); }

        .urgency-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; }

        .urgency-card { padding: 18px; border-radius: 12px; background: #122b44; border: 1px solid rgba(255,255,255,.05); }
        .urgency-icon { font-size: 22px; margin-bottom: 9px; }
        .urgency-value { font-size: 25px; font-weight: 700; }
        .urgency-label { font-size: 12px; color: #91a8bd; margin-top: 4px; }
        .urgency-overdue { border-left: 3px solid #e4515c; }
        .urgency-today { border-left: 3px solid #ef9c42; }
        .urgency-next { border-left: 3px solid #e5bf52; }
        .urgency-upcoming { border-left: 3px solid #39bde9; }

        .insights-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 15px; }
        .insight { background: #132b43; border-radius: 12px; padding: 18px; min-width: 0; }
        .insight-label { font-size: 11px; color: #7fa0bc; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 7px; }
        .insight-value { font-size: 20px; font-weight: 700; }
        .insight-text { color: #8199af; font-size: 12px; line-height: 1.5; margin-top: 5px; overflow-wrap: anywhere; }

        .loading { text-align: center; padding: 35px 15px; color: #8fa5ba; }
        .error { text-align: center; padding: 30px; color: #f27780; background: rgba(180,40,50,.08); border: 1px solid rgba(220,70,80,.2); border-radius: 12px; overflow-wrap: anywhere; }

        @media(max-width:1050px) {
            .stats-grid { grid-template-columns: repeat(3,1fr); }
        }

        @media(max-width:800px) {
            .two-column { grid-template-columns: 1fr; }
            .insights-grid { grid-template-columns: 1fr; }
        }

        @media(max-width:600px) {
            .container { width: 94%; padding-top: 22px; }
            .navbar { flex-direction: column; padding: 12px; }
            .nav-links { justify-content: center; }
            .nav-links a { padding: 8px; font-size: 12px; }
            .stats-grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
            .stat-card { padding: 15px; }
            .stat-value { font-size: 25px; }
            .page-header h1 { font-size: 25px; }
            .card { padding: 18px; }
        }

        @media(max-width:400px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
<nav class="navbar">
    <div class="brand">⏰ Deadline <span>Radar</span></div>
    <div class="nav-links">
        <a href="dashboard">Dashboard</a>
        <a href="viewDeadlines">Deadlines</a>
        <a href="calendar.html">Calendar</a>
        <a href="analytics.html" class="active">Analytics</a>
    </div>
</nav>

<main class="container">
    <div class="page-header">
        <h1>Analytics &amp; Progress</h1>
        <p>Understand your deadline workload, completion progress and task distribution.</p>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="loadAnalytics()">↻ Refresh Analytics</button>
        </div>
    </div>

    <div id="analyticsContent">
        <div class="loading">Loading analytics...</div>
    </div>

    <div class="bottom-links">
        <a href="dashboard" class="btn">← Dashboard</a>
        <a href="viewDeadlines" class="btn">View Deadlines</a>
        <a href="calendar.html" class="btn">Open Calendar</a>
    </div>
</main>

<script>
"use strict";

/*
 * Convert common JSON collection formats to arrays.
 * Supports arrays, nested arrays, and objects keyed by category/priority.
 */
function toArray(value, type) {
    if (Array.isArray(value)) return value;
    if (!value || typeof value !== "object") return [];

    if (Array.isArray(value[type])) return value[type];

    const labelKey = type === "categories" ? "category" : "priority";

    return Object.entries(value).map(([key, item]) => {
        if (item && typeof item === "object") {
            return {
                ...item,
                [labelKey]: item[labelKey] ?? item.name ?? key
            };
        }

        return {
            [labelKey]: key,
            count: Number(item) || 0
        };
    });
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function numeric(value) {
    const parsed = Number(value);
    return Number.isFinite(parsed) ? parsed : 0;
}

async function loadAnalytics() {
    const container = document.getElementById("analyticsContent");
    container.innerHTML = '<div class="loading">Loading analytics...</div>';

    try {
        /*
         * Assumes the servlet mapping is /analytics.
         * This resolves relative to the current application URL.
         */
        const response = await fetch(
            new URL("analytics", window.location.href),
            {
                headers: { Accept: "application/json" },
                credentials: "same-origin"
            }
        );

        if (response.status === 401 || response.status === 403) {
            window.location.href = "login.html";
            return;
        }

        if (!response.ok) {
            throw new Error(
                "Analytics request failed: HTTP " + response.status +
                ". Verify the AnalyticsServlet mapping."
            );
        }

        const data = await response.json();

        if (!data || typeof data !== "object" || data.error) {
            throw new Error(data?.error || "Invalid analytics response.");
        }

        renderAnalytics(data);
    } catch (error) {
        console.error("Analytics loading error:", error);

        container.innerHTML = `
            <div class="error">
                ⚠️ Unable to load analytics.
                <br><br>
                ${escapeHtml(error.message)}
                <br><br>
                Check the Console and Network tabs for the failed request.
            </div>
        `;
    }
}

function renderAnalytics(data) {
    const total = numeric(data.total);
    const pending = numeric(data.pending);
    const completed = numeric(data.completed);
    const overdue = numeric(data.overdue);
    const highPriority = numeric(data.highPriority);
    const dueToday = numeric(data.dueToday);
    const dueNext3Days = numeric(data.dueNext3Days);
    const upcoming = numeric(data.upcoming);

    const completion = Math.max(
        0,
        Math.min(100, numeric(data.completionPercentage))
    );

    const progressDegrees = completion * 3.6;

    let workload = "Light";
    if (pending >= 7) workload = "Heavy";
    else if (pending >= 4) workload = "Moderate";

    let attention = "Low";
    if (overdue > 0) attention = "Critical";
    else if (highPriority >= 3 || dueToday >= 2) attention = "High";
    else if (highPriority > 0 || dueNext3Days > 0) attention = "Moderate";

    /* Category distribution */
    const categories = toArray(data.categories, "categories");

    const categoryCounts = categories.map(item => ({
        label: item?.category ?? item?.name ?? "Uncategorized",
        count: numeric(item?.count ?? item?.total)
    }));

    const maxCategory = Math.max(1, ...categoryCounts.map(item => item.count));
    let categoriesHtml = "";

    categoryCounts.forEach(item => {
        const width = Math.max(0, Math.min(100, item.count / maxCategory * 100));

        categoriesHtml += `
            <div class="bar-row">
                <div class="bar-header">
                    <span class="bar-name">${escapeHtml(item.label)}</span>
                    <span class="bar-count">${item.count}</span>
                </div>
                <div class="bar-track">
                    <div class="bar-fill" style="width:${width}%"></div>
                </div>
            </div>
        `;
    });

    if (!categoriesHtml) {
        categoriesHtml = '<div class="loading">No category data available.</div>';
    }

    /* Priority distribution */
    const priorities = toArray(data.priorities, "priorities");

    const priorityCounts = priorities.map(item => ({
        label: item?.priority ?? item?.name ?? "Unspecified",
        count: numeric(item?.count ?? item?.total)
    }));

    const maxPriority = Math.max(1, ...priorityCounts.map(item => item.count));
    let prioritiesHtml = "";

    priorityCounts.forEach(item => {
        const width = Math.max(0, Math.min(100, item.count / maxPriority * 100));
        const name = String(item.label).toLowerCase();

        let className = "";
        if (name === "high") className = "priority-high";
        else if (name === "medium") className = "priority-medium";
        else if (name === "low") className = "priority-low";

        prioritiesHtml += `
            <div class="bar-row ${className}">
                <div class="bar-header">
                    <span class="bar-name">${escapeHtml(item.label)}</span>
                    <span class="bar-count">${item.count}</span>
                </div>
                <div class="bar-track">
                    <div class="bar-fill" style="width:${width}%"></div>
                </div>
            </div>
        `;
    });

    if (!prioritiesHtml) {
        prioritiesHtml = '<div class="loading">No priority data available.</div>';
    }

    /* Productivity insight */
    let productivityMessage = "Your workload is currently manageable.";

    if (overdue > 0) {
        productivityMessage = "You have overdue deadlines that need immediate attention.";
    } else if (dueToday > 0) {
        productivityMessage = "You have deadlines due today. Consider completing these first.";
    } else if (highPriority > 0) {
        productivityMessage = "Focus on your high-priority deadlines before lower-priority tasks.";
    } else if (completion >= 75) {
        productivityMessage = "Excellent progress! Your completion rate is strong.";
    } else if (completion >= 50) {
        productivityMessage = "Good progress. Keep completing pending deadlines consistently.";
    } else {
        productivityMessage = "Try completing a few pending deadlines to improve your progress.";
    }

    document.getElementById("analyticsContent").innerHTML = `
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Deadlines</div>
                <div class="stat-value">${total}</div>
                <div class="stat-info">All deadlines</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pending</div>
                <div class="stat-value">${pending}</div>
                <div class="stat-info">Need attention</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Completed</div>
                <div class="stat-value">${completed}</div>
                <div class="stat-info">Successfully finished</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Overdue</div>
                <div class="stat-value">${overdue}</div>
                <div class="stat-info">Past due date</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">High Priority</div>
                <div class="stat-value">${highPriority}</div>
                <div class="stat-info">Important tasks</div>
            </div>
        </div>

        <div class="two-column">
            <section class="card">
                <div class="card-title">Completion Progress</div>
                <div class="card-subtitle">Percentage of your deadlines completed.</div>
                <div class="completion-area">
                    <div class="progress-circle" style="--progress:${progressDegrees}deg">
                        <div class="progress-content">
                            <div class="progress-number">${completion.toFixed(1)}%</div>
                            <div class="progress-label">Completed</div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="card">
                <div class="card-title">Deadline Categories</div>
                <div class="card-subtitle">Distribution of your deadlines by category.</div>
                ${categoriesHtml}
            </section>
        </div>

        <div class="two-column">
            <section class="card">
                <div class="card-title">Priority Distribution</div>
                <div class="card-subtitle">Understand where your attention is concentrated.</div>
                ${prioritiesHtml}
            </section>

            <section class="card">
                <div class="card-title">Deadline Urgency</div>
                <div class="card-subtitle">Your upcoming workload based on due dates.</div>
                <div class="urgency-grid">
                    <div class="urgency-card urgency-overdue">
                        <div class="urgency-icon">🔴</div>
                        <div class="urgency-value">${overdue}</div>
                        <div class="urgency-label">Overdue</div>
                    </div>
                    <div class="urgency-card urgency-today">
                        <div class="urgency-icon">🚨</div>
                        <div class="urgency-value">${dueToday}</div>
                        <div class="urgency-label">Due Today</div>
                    </div>
                    <div class="urgency-card urgency-next">
                        <div class="urgency-icon">⚠️</div>
                        <div class="urgency-value">${dueNext3Days}</div>
                        <div class="urgency-label">Next 3 Days</div>
                    </div>
                    <div class="urgency-card urgency-upcoming">
                        <div class="urgency-icon">📅</div>
                        <div class="urgency-value">${upcoming}</div>
                        <div class="urgency-label">Upcoming</div>
                    </div>
                </div>
            </section>
        </div>

        <section class="card">
            <div class="card-title">Smart Productivity Insights</div>
            <div class="card-subtitle">A quick analysis of your current workload.</div>
            <div class="insights-grid">
                <div class="insight">
                    <div class="insight-label">Workload</div>
                    <div class="insight-value">${workload}</div>
                    <div class="insight-text">Based on your current pending deadlines.</div>
                </div>
                <div class="insight">
                    <div class="insight-label">Completion Rate</div>
                    <div class="insight-value">${completion.toFixed(1)}%</div>
                    <div class="insight-text">${escapeHtml(productivityMessage)}</div>
                </div>
                <div class="insight">
                    <div class="insight-label">Attention Needed</div>
                    <div class="insight-value">${attention}</div>
                    <div class="insight-text">${overdue} overdue · ${highPriority} high priority</div>
                </div>
            </div>
        </section>
    `;
}

loadAnalytics();
</script>
</body>
</html>
