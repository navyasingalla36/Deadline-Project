<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Calendar | Deadline Radar</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    #12345a,
                    transparent 35%
                ),
                #081321;

            color: #ffffff;
        }


        /* =========================
           NAVBAR
        ========================== */

        .navbar {

            height: 70px;

            padding: 0 30px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(8, 19, 33, 0.92);

            border-bottom:
                1px solid rgba(255,255,255,0.08);

            position: sticky;

            top: 0;

            z-index: 10;
        }


        .brand {

            font-size: 22px;

            font-weight: bold;
        }


        .brand span {

            color: #00d9ff;
        }


        .nav-buttons {

            display: flex;

            gap: 10px;
        }


        .nav-buttons a {

            text-decoration: none;

            color: #d9e8f5;

            padding: 10px 15px;

            border-radius: 8px;

            transition: 0.2s;
        }


        .nav-buttons a:hover {

            background:
                rgba(0,217,255,0.12);

            color: #00d9ff;
        }


        /* =========================
           MAIN
        ========================== */

        .container {

            width: min(1200px, 94%);

            margin: 30px auto;
        }


        .header {

            margin-bottom: 25px;
        }


        .header h1 {

            font-size: 32px;

            margin-bottom: 8px;
        }


        .header p {

            color: #9fb4c9;
        }


        /* =========================
           CALENDAR CARD
        ========================== */

        .calendar-card {

            background:
                rgba(15, 35, 57, 0.88);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.25);
        }


        /* =========================
           CALENDAR HEADER
        ========================== */

        .calendar-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .month-title {

            font-size: 25px;

            font-weight: bold;
        }


        .calendar-controls {

            display: flex;

            gap: 8px;
        }


        .calendar-controls button {

            border: none;

            background: #123653;

            color: white;

            min-width: 42px;

            height: 38px;

            padding: 0 12px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

            transition: 0.2s;
        }


        .calendar-controls button:hover {

            background: #00aeca;
        }


        /* =========================
           WEEK DAYS
        ========================== */

        .weekdays {

            display: grid;

            grid-template-columns:
                repeat(7, 1fr);
        }


        .weekday {

            text-align: center;

            padding: 12px 5px;

            color: #8fa7bd;

            font-weight: bold;
        }


        /* =========================
           CALENDAR GRID
        ========================== */

        .calendar-grid {

            display: grid;

            grid-template-columns:
                repeat(7, 1fr);

            border-top:
                1px solid rgba(255,255,255,0.05);

            border-left:
                1px solid rgba(255,255,255,0.05);
        }


        /* =========================
           DAY
        ========================== */

        .day {

            min-height: 105px;

            border-right:
                1px solid rgba(255,255,255,0.05);

            border-bottom:
                1px solid rgba(255,255,255,0.05);

            padding: 8px;

            position: relative;

            cursor: pointer;

            transition: 0.2s;

            background:
                rgba(8,19,33,0.35);
        }


        .day:hover {

            background:
                rgba(0,217,255,0.08);
        }


        .other-month {

            opacity: 0.30;
        }


        .day-number {

            font-size: 14px;

            display: inline-flex;

            width: 28px;

            height: 28px;

            align-items: center;

            justify-content: center;

            border-radius: 50%;
        }


        /* =========================
           TODAY
        ========================== */

        .today .day-number {

            background: #00d9ff;

            color: #06121f;

            font-weight: bold;
        }


        /* =========================
           DEADLINE
        ========================== */

        .deadline {

            margin-top: 7px;

            padding: 5px 7px;

            border-radius: 6px;

            font-size: 11px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            background:
                rgba(0,217,255,0.15);

            border-left:
                3px solid #00d9ff;

            cursor: pointer;

            transition: 0.2s;
        }


        .deadline:hover {

            transform:
                translateY(-1px);

            background:
                rgba(0,217,255,0.25);
        }


        .deadline.high {

            border-left-color:
                #ff5252;

            background:
                rgba(255,82,82,0.12);
        }


        .deadline.medium {

            border-left-color:
                #ffc107;

            background:
                rgba(255,193,7,0.12);
        }


        .deadline.low {

            border-left-color:
                #4caf50;

            background:
                rgba(76,175,80,0.12);
        }


        /* =========================
           LEGEND
        ========================== */

        .legend {

            display: flex;

            gap: 20px;

            margin-top: 22px;

            flex-wrap: wrap;

            color: #b8c9d8;

            font-size: 13px;
        }


        .legend-item {

            display: flex;

            align-items: center;

            gap: 7px;
        }


        .dot {

            width: 10px;

            height: 10px;

            border-radius: 50%;
        }


        .red {
            background: #ff5252;
        }


        .yellow {
            background: #ffc107;
        }


        .green {
            background: #4caf50;
        }


        .blue {
            background: #00d9ff;
        }


        /* =========================
           DATE DETAILS OVERLAY
        ========================== */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.70);

            z-index: 100;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .modal.show {

            display: flex;
        }


        .modal-box {

            width: min(520px, 100%);

            max-height: 85vh;

            overflow-y: auto;

            background:
                #10263d;

            border:
                1px solid rgba(255,255,255,0.10);

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.50);

            animation:
                modalIn 0.2s ease;
        }


        @keyframes modalIn {

            from {

                opacity: 0;

                transform:
                    translateY(15px)
                    scale(0.97);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        .modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }


        .modal-header h2 {

            font-size: 22px;
        }


        .close-btn {

            border: none;

            background:
                rgba(255,255,255,0.08);

            color: white;

            width: 35px;

            height: 35px;

            border-radius: 50%;

            cursor: pointer;

            font-size: 20px;
        }


        .close-btn:hover {

            background:
                rgba(255,82,82,0.25);
        }


        /* =========================
           DEADLINE DETAILS
        ========================== */

        .deadline-card {

            background:
                rgba(8,19,33,0.60);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 12px;

            padding: 16px;

            margin-bottom: 12px;
        }


        .deadline-title {

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .deadline-info {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

            margin-bottom: 14px;
        }


        .badge {

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 11px;

            background:
                rgba(0,217,255,0.12);

            color: #9fefff;
        }


        .badge.high {

            background:
                rgba(255,82,82,0.15);

            color: #ff8585;
        }


        .badge.medium {

            background:
                rgba(255,193,7,0.15);

            color: #ffd76a;
        }


        .badge.low {

            background:
                rgba(76,175,80,0.15);

            color: #8be58e;
        }


        .edit-btn {

            display: inline-block;

            text-decoration: none;

            padding: 9px 14px;

            border-radius: 8px;

            background:
                #00aeca;

            color: white;

            font-size: 13px;

            transition: 0.2s;
        }


        .edit-btn:hover {

            background:
                #00c4e8;
        }


        .no-deadlines {

            text-align: center;

            padding: 35px 10px;

            color: #8fa7bd;
        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 700px) {

            .navbar {

                padding: 0 15px;
            }


            .brand {

                font-size: 18px;
            }


            .nav-buttons {

                gap: 3px;
            }


            .nav-buttons a {

                padding: 8px;

                font-size: 12px;
            }


            .container {

                width: 96%;
            }


            .calendar-card {

                padding: 12px;
            }


            .month-title {

                font-size: 20px;
            }


            .day {

                min-height: 80px;

                padding: 5px;
            }


            .weekday {

                font-size: 11px;
            }


            .deadline {

                font-size: 9px;

                padding: 4px;
            }

        }


        @media (max-width: 480px) {

            .navbar {

                height: auto;

                min-height: 60px;

                padding: 10px;
            }


            .nav-buttons a {

                font-size: 10px;

                padding: 6px;
            }


            .header h1 {

                font-size: 25px;
            }


            .calendar-card {

                overflow-x: auto;
            }


            .weekdays,
            .calendar-grid {

                min-width: 600px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================== -->

<nav class="navbar">

    <div class="brand">

        ⏰ Deadline <span>Radar</span>

    </div>


    <div class="nav-buttons">

        <a href="dashboard">
            Dashboard
        </a>

        <a href="add-deadline.html">
            + Add
        </a>

        <a href="viewDeadlines">
            Deadlines
        </a>

    </div>

</nav>



<!-- =========================
     MAIN
========================== -->

<main class="container">


    <div class="header">

        <h1>
            📅 Deadline Calendar
        </h1>

        <p>
            View and track your deadlines by date.
        </p>

    </div>



    <div class="calendar-card">


        <!-- CALENDAR HEADER -->

        <div class="calendar-header">


            <div
                class="month-title"
                id="monthTitle">

                Loading...

            </div>


            <div class="calendar-controls">


                <button
                    onclick="previousMonth()">

                    ‹

                </button>


                <button
                    onclick="goToday()">

                    Today

                </button>


                <button
                    onclick="nextMonth()">

                    ›

                </button>


            </div>


        </div>



        <!-- WEEKDAYS -->

        <div class="weekdays">

            <div class="weekday">Sun</div>

            <div class="weekday">Mon</div>

            <div class="weekday">Tue</div>

            <div class="weekday">Wed</div>

            <div class="weekday">Thu</div>

            <div class="weekday">Fri</div>

            <div class="weekday">Sat</div>

        </div>



        <!-- CALENDAR GRID -->

        <div
            class="calendar-grid"
            id="calendarGrid">

        </div>



        <!-- LEGEND -->

        <div class="legend">


            <div class="legend-item">

                <span class="dot red"></span>

                High Priority

            </div>


            <div class="legend-item">

                <span class="dot yellow"></span>

                Medium Priority

            </div>


            <div class="legend-item">

                <span class="dot green"></span>

                Low Priority

            </div>


            <div class="legend-item">

                <span class="dot blue"></span>

                Other Deadline

            </div>


        </div>


    </div>


</main>



<!-- =========================
     DATE DETAILS MODAL
========================== -->

<div
    class="modal"
    id="dateModal">


    <div class="modal-box">


        <div class="modal-header">


            <h2 id="modalDate">
                Date
            </h2>


            <button
                class="close-btn"
                onclick="closeModal()">

                ×

            </button>


        </div>


        <div id="modalContent">

        </div>


    </div>


</div>



<script>


/* =====================================
   GLOBAL VARIABLES
===================================== */

let currentDate =
    new Date();


let deadlines = [];



/* =====================================
   LOAD DEADLINES
===================================== */

async function loadDeadlines() {


    try {


        const response =
            await fetch(
                "calendarData",
                {
                    method: "GET",

                    cache: "no-store"
                }
            );


        if (
            response.status === 401
        ) {

            window.location.href =
                "login.html";

            return;

        }


        if (!response.ok) {

            throw new Error(
                "Unable to load deadlines"
            );

        }


        deadlines =
            await response.json();


        renderCalendar();


    }

    catch (error) {


        console.error(
            "Calendar error:",
            error
        );


        document.getElementById(
            "calendarGrid"
        ).innerHTML = `

            <div class="no-deadlines">

                ❌ Unable to load deadlines.

                <br><br>

                Please refresh the page.

            </div>

        `;

    }

}



/* =====================================
   RENDER CALENDAR
===================================== */

function renderCalendar() {


    const year =
        currentDate.getFullYear();


    const month =
        currentDate.getMonth();



    const monthNames = [

        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"

    ];



    document.getElementById(
        "monthTitle"
    ).textContent =

        monthNames[month]
        + " "
        + year;



    const grid =
        document.getElementById(
            "calendarGrid"
        );


    grid.innerHTML = "";



    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();



    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();



    const previousMonthDays =
        new Date(
            year,
            month,
            0
        ).getDate();



    /* PREVIOUS MONTH */

    for (
        let i = firstDay - 1;
        i >= 0;
        i--
    ) {

        createDay(
            previousMonthDays - i,
            true
        );

    }



    /* CURRENT MONTH */

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        createDay(
            day,
            false
        );

    }



    /* NEXT MONTH */

    const totalCells =
        grid.children.length;


    const remaining =
        42 - totalCells;


    for (
        let day = 1;
        day <= remaining;
        day++
    ) {

        createDay(
            day,
            true
        );

    }

}



/* =====================================
   CREATE DAY
===================================== */

function createDay(
    dayNumber,
    otherMonth
) {


    const grid =
        document.getElementById(
            "calendarGrid"
        );


    const year =
        currentDate.getFullYear();


    const month =
        currentDate.getMonth();



    const dayElement =
        document.createElement(
            "div"
        );


    dayElement.className =
        "day";



    if (otherMonth) {

        dayElement.classList.add(
            "other-month"
        );

    }



    let actualDate =
        null;



    if (!otherMonth) {

        actualDate =
            new Date(
                year,
                month,
                dayNumber
            );

    }



    /* TODAY */

    const today =
        new Date();



    if (

        actualDate &&

        actualDate.getFullYear()
            === today.getFullYear() &&

        actualDate.getMonth()
            === today.getMonth() &&

        actualDate.getDate()
            === today.getDate()

    ) {

        dayElement.classList.add(
            "today"
        );

    }



    /* DAY NUMBER */

    const number =
        document.createElement(
            "div"
        );


    number.className =
        "day-number";


    number.textContent =
        dayNumber;


    dayElement.appendChild(
        number
    );



    /* DEADLINES */

    if (actualDate) {


        const dateString =
            formatDate(
                actualDate
            );


        const dayDeadlines =
            deadlines.filter(
                function(deadline) {

                    return (
                        deadline.dueDate
                        === dateString
                    );

                }
            );



        dayDeadlines.forEach(
            function(deadline) {


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "deadline";



                const priority =
                    (
                        deadline.priority
                        || ""
                    ).toLowerCase();



                if (
                    priority === "high"
                ) {

                    item.classList.add(
                        "high"
                    );

                }

                else if (
                    priority === "medium"
                ) {

                    item.classList.add(
                        "medium"
                    );

                }

                else if (
                    priority === "low"
                ) {

                    item.classList.add(
                        "low"
                    );

                }



                item.textContent =
                    deadline.title;


                item.title =
                    deadline.title;



                /*
                 * Clicking a deadline
                 * still opens EDIT.
                 */

                item.onclick =
                    function(event) {


                        event.stopPropagation();


                        window.location.href =
                            "editDeadline?id="
                            +
                            deadline.id;

                    };



                dayElement.appendChild(
                    item
                );

            }
        );



        /*
         * Clicking the DATE itself
         * opens the details popup.
         */

        dayElement.onclick =
            function() {

                openDateModal(
                    actualDate
                );

            };

    }



    grid.appendChild(
        dayElement
    );

}



/* =====================================
   OPEN DATE MODAL
===================================== */

function openDateModal(
    date
) {


    const dateString =
        formatDate(date);


    const selectedDeadlines =
        deadlines.filter(
            function(deadline) {

                return (
                    deadline.dueDate
                    === dateString
                );

            }
        );



    /* DATE TITLE */

    const formattedDate =
        date.toLocaleDateString(
            "en-IN",
            {
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );


    document.getElementById(
        "modalDate"
    ).textContent =

        "📅 " +
        formattedDate;



    const content =
        document.getElementById(
            "modalContent"
        );


    content.innerHTML = "";



    /* NO DEADLINES */

    if (
        selectedDeadlines.length === 0
    ) {


        content.innerHTML = `

            <div class="no-deadlines">

                📭

                <br><br>

                No deadlines scheduled
                for this date.

            </div>

        `;


    }

    else {


        selectedDeadlines.forEach(
            function(deadline) {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "deadline-card";



                const priority =
                    (
                        deadline.priority
                        || ""
                    ).toLowerCase();



                let priorityClass =
                    "";


                if (
                    priority === "high"
                ) {

                    priorityClass =
                        "high";

                }

                else if (
                    priority === "medium"
                ) {

                    priorityClass =
                        "medium";

                }

                else if (
                    priority === "low"
                ) {

                    priorityClass =
                        "low";

                }



                card.innerHTML = `

                    <div class="deadline-title">

                        ${escapeHtml(
                            deadline.title
                        )}

                    </div>


                    <div class="deadline-info">


                        <span
                            class="badge
                            ${priorityClass}">

                            ${escapeHtml(
                                deadline.priority
                                || "No Priority"
                            )}

                        </span>


                        <span class="badge">

                            ${escapeHtml(
                                deadline.status
                                || "Pending"
                            )}

                        </span>


                    </div>


                    <a
                        class="edit-btn"
                        href="editDeadline?id=${
                            deadline.id
                        }">

                        ✏️ Edit Deadline

                    </a>

                `;


                content.appendChild(
                    card
                );

            }
        );

    }



    document.getElementById(
        "dateModal"
    ).classList.add(
        "show"
    );

}



/* =====================================
   CLOSE MODAL
===================================== */

function closeModal() {


    document.getElementById(
        "dateModal"
    ).classList.remove(
        "show"
    );

}



/* =====================================
   CLOSE WHEN CLICKING OUTSIDE
===================================== */

document.getElementById(
    "dateModal"
).addEventListener(
    "click",
    function(event) {


        if (
            event.target ===
            this
        ) {

            closeModal();

        }

    }
);



/* =====================================
   ESCAPE KEY
===================================== */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Escape"
        ) {

            closeModal();

        }

    }
);



/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(
    value
) {


    if (!value) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================
   FORMAT DATE
===================================== */

function formatDate(
    date
) {


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    return (

        year
        + "-"
        + month
        + "-"
        + day

    );

}



/* =====================================
   PREVIOUS MONTH
===================================== */

function previousMonth() {


    currentDate.setMonth(

        currentDate.getMonth()
        - 1

    );


    renderCalendar();

}



/* =====================================
   NEXT MONTH
===================================== */

function nextMonth() {


    currentDate.setMonth(

        currentDate.getMonth()
        + 1

    );


    renderCalendar();

}



/* =====================================
   TODAY
===================================== */
